apiVersion: vectorsearch.gcp.m.upbound.io/v1beta1
kind: Index
metadata:
  annotations:
    meta.upbound.io/example-id: vectorsearch/v1beta1/index
    crossplane.io/external-name: example-index
    uptest.upbound.io/timeout: "5400" # An index build can take over an hour.
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: upbound-system
spec:
  forProvider:
    location: us-central1
    collectionIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example-index-parent
    indexField: embedding
    distanceMetric: COSINE_DISTANCE
    denseScann:
      featureNormType: UNIT_L2_NORM
    dedicatedInfrastructure:
      mode: PERFORMANCE_OPTIMIZED
      autoscalingSpec:
        minReplicaCount: 1
        maxReplicaCount: 1

---

apiVersion: vectorsearch.gcp.m.upbound.io/v1beta1
kind: Collection
metadata:
  annotations:
    meta.upbound.io/example-id: vectorsearch/v1beta1/index
    crossplane.io/external-name: example-index-parent
  labels:
    testing.upbound.io/example-name: example-index-parent
  name: example-index-parent
  namespace: upbound-system
spec:
  forProvider:
    location: us-central1
    vectorSchema:
    - fieldName: embedding
      denseVector:
        dimensions: 8
