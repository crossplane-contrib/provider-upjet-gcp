apiVersion: alloydb.gcp.m.upbound.io/v1beta1
kind: User
metadata:
  annotations:
    meta.upbound.io/example-id: alloydb/v1beta1/user
    uptest.upbound.io/timeout: "3600"
  labels:
    testing.upbound.io/example-name: alloydbuserv1beta1ns
  name: alloydbuserv1beta1ns
  namespace: upbound-system
spec:
  forProvider:
    clusterSelector:
      matchLabels:
        testing.upbound.io/example-name: alloydbuserv1beta1ns
    userType: ALLOYDB_BUILT_IN
    databaseRoles:
    - alloydbsuperuser
    passwordSecretRef:
      key: password
      name: alloydbuserv1beta1ns
  writeConnectionSecretToRef:
    name: alloydb-user-connection-secret
---
apiVersion: alloydb.gcp.m.upbound.io/v1beta1
kind: Instance
metadata:
  annotations:
    meta.upbound.io/example-id: alloydb/v1beta1/user
    uptest.upbound.io/pre-delete-hook: ../testhooks/delete-user.sh
  labels:
    testing.upbound.io/example-name: alloydbuserv1beta1ns
  name: alloydbuserv1beta1ns
  namespace: upbound-system
spec:
  forProvider:
    availabilityType: ZONAL
    clusterSelector:
      matchLabels:
        testing.upbound.io/example-name: alloydbuserv1beta1ns
    instanceType: PRIMARY
    machineConfig:
      cpuCount: 2
---
apiVersion: v1
data:
  password: Y2hhbmdlbWU=
kind: Secret
metadata:
  annotations:
    meta.upbound.io/example-id: alloydb/v1beta1/user
  labels:
    testing.upbound.io/example-name: alloydbuserv1beta1ns
  name: alloydbuserv1beta1ns
  namespace: upbound-system
---
apiVersion: alloydb.gcp.m.upbound.io/v1beta1
kind: Cluster
metadata:
  annotations:
    meta.upbound.io/example-id: alloydb/v1beta1/user
  labels:
    testing.upbound.io/example-name: alloydbuserv1beta1ns
  name: alloydbuserv1beta1ns
  namespace: upbound-system
spec:
  forProvider:
    deletionProtection: false
    initialUser:
      passwordSecretRef:
        key: example-key
        name: example-secret
    location: us-central1
    networkConfig:
      networkSelector:
        matchLabels:
          testing.upbound.io/example-name: alloydbuserv1beta1ns
---
apiVersion: compute.gcp.m.upbound.io/v1beta1
kind: GlobalAddress
metadata:
  annotations:
    meta.upbound.io/example-id: alloydb/v1beta1/user
  labels:
    testing.upbound.io/example-name: alloydbuserv1beta1ns
  name: alloydbuserv1beta1ns
  namespace: upbound-system
spec:
  forProvider:
    addressType: INTERNAL
    networkSelector:
      matchLabels:
        testing.upbound.io/example-name: alloydbuserv1beta1ns
    prefixLength: 16
    purpose: VPC_PEERING
---
apiVersion: compute.gcp.m.upbound.io/v1beta1
kind: Network
metadata:
  annotations:
    meta.upbound.io/example-id: alloydb/v1beta1/user
  labels:
    testing.upbound.io/example-name: alloydbuserv1beta1ns
  name: alloydbuserv1beta1ns
  namespace: upbound-system
spec:
  forProvider: {}
---
apiVersion: servicenetworking.gcp.m.upbound.io/v1beta1
kind: Connection
metadata:
  annotations:
    meta.upbound.io/example-id: alloydb/v1beta1/user
  labels:
    testing.upbound.io/example-name: alloydbuserv1beta1ns
  name: alloydbuserv1beta1ns
  namespace: upbound-system
spec:
  forProvider:
    networkSelector:
      matchLabels:
        testing.upbound.io/example-name: alloydbuserv1beta1ns
    reservedPeeringRangesRefs:
      - name: alloydbuserv1beta1ns
    service: servicenetworking.googleapis.com
