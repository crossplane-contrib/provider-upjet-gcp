apiVersion: alloydb.gcp.upbound.io/v1beta1
kind: User
metadata:
  annotations:
    meta.upbound.io/example-id: alloydb/v1beta1/user
    uptest.upbound.io/timeout: "3600"
  labels:
    testing.upbound.io/example-name: alloydbuserv1beta1
  name: alloydbuserv1beta1
spec:
  forProvider:
    clusterSelector:
      matchLabels:
        testing.upbound.io/example-name: alloydbuserv1beta1
    userType: ALLOYDB_BUILT_IN
    databaseRoles:
    - alloydbsuperuser
    passwordSecretRef:
      key: password
      name: alloydbuserv1beta1
      namespace: upbound-system
  writeConnectionSecretToRef:
    name: alloydb-user-connection-secret
    namespace: upbound-system

---

apiVersion: alloydb.gcp.upbound.io/v1beta2
kind: Instance
metadata:
  annotations:
    meta.upbound.io/example-id: alloydb/v1beta1/user
    uptest.upbound.io/pre-delete-hook: ../testhooks/delete-user.sh
  labels:
    testing.upbound.io/example-name: alloydbuserv1beta1
  name: alloydbuserv1beta1
spec:
  forProvider:
    availabilityType: ZONAL
    clusterSelector:
      matchLabels:
        testing.upbound.io/example-name: alloydbuserv1beta1
    instanceType: PRIMARY
    machineConfig:
      cpuCount: 2

---

apiVersion: v1
data:
  password: Y2hhbmdlbWU=
kind: Secret
metadata:
  annotations:
    meta.upbound.io/example-id: alloydb/v1beta1/user
  labels:
    testing.upbound.io/example-name: alloydbuserv1beta1
  name: alloydbuserv1beta1
  namespace: upbound-system

---

apiVersion: alloydb.gcp.upbound.io/v1beta2
kind: Cluster
metadata:
  annotations:
    meta.upbound.io/example-id: alloydb/v1beta1/user
  labels:
    testing.upbound.io/example-name: alloydbuserv1beta1
  name: alloydbuserv1beta1
spec:
  forProvider:
    deletionProtection: false
    initialUser:
      passwordSecretRef:
        key: example-key
        name: example-secret
        namespace: upbound-system
    location: us-central1
    networkConfig:
      networkSelector:
        matchLabels:
          testing.upbound.io/example-name: alloydbuserv1beta1

---

apiVersion: compute.gcp.upbound.io/v1beta1
kind: GlobalAddress
metadata:
  annotations:
    meta.upbound.io/example-id: alloydb/v1beta1/user
  labels:
    testing.upbound.io/example-name: alloydbuserv1beta1
  name: alloydbuserv1beta1
spec:
  forProvider:
    addressType: INTERNAL
    networkSelector:
      matchLabels:
        testing.upbound.io/example-name: alloydbuserv1beta1
    prefixLength: 16
    purpose: VPC_PEERING

---

apiVersion: compute.gcp.upbound.io/v1beta1
kind: Network
metadata:
  annotations:
    meta.upbound.io/example-id: alloydb/v1beta1/user
  labels:
    testing.upbound.io/example-name: alloydbuserv1beta1
  name: alloydbuserv1beta1
spec:
  forProvider: {}

---

apiVersion: servicenetworking.gcp.upbound.io/v1beta1
kind: Connection
metadata:
  annotations:
    meta.upbound.io/example-id: alloydb/v1beta1/user
  labels:
    testing.upbound.io/example-name: alloydbuserv1beta1
  name: alloydbuserv1beta1
spec:
  forProvider:
    networkSelector:
      matchLabels:
        testing.upbound.io/example-name: alloydbuserv1beta1
    reservedPeeringRangesRefs:
    - name: alloydbuserv1beta1
    service: servicenetworking.googleapis.com
