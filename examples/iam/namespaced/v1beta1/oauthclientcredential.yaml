apiVersion: iam.gcp.m.upbound.io/v1beta1
kind: OAuthClientCredential
metadata:
  annotations:
    meta.upbound.io/example-id: iam/v1beta1/oauthclientcredential
  labels:
    testing.upbound.io/example-name: oauth_client_credential
  name: example-${Rand.RFC1123Subdomain}
  namespace: upbound-system
spec:
  forProvider:
    disabled: true
    displayName: Example credential
    location: global
    oauthclientSelector:
      matchLabels:
        testing.upbound.io/example-name: oauth_client_credential
  writeConnectionSecretToRef:
    name: oauth-client-credential

---

apiVersion: iam.gcp.m.upbound.io/v1beta1
kind: OAuthClient
metadata:
  annotations:
    meta.upbound.io/example-id: iam/v1beta1/oauthclientcredential
  labels:
    testing.upbound.io/example-name: oauth_client_credential
  name: example-${Rand.RFC1123Subdomain}
  namespace: upbound-system
spec:
  forProvider:
    allowedGrantTypes:
      - AUTHORIZATION_CODE_GRANT
    allowedRedirectUris:
      - https://www.example.com
    allowedScopes:
      - https://www.googleapis.com/auth/cloud-platform
    clientType: CONFIDENTIAL_CLIENT
    description: A sample OAuth client
    disabled: false
    displayName: Example OAuth client
    location: global
