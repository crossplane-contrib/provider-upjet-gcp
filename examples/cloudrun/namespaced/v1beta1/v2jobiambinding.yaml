apiVersion: cloudrun.gcp.m.upbound.io/v1beta1
kind: V2JobIAMBinding
metadata:
  annotations:
    meta.upbound.io/example-id: cloudrun/v1beta1/v2jobiambinding
  labels:
    testing.upbound.io/example-name: editor
  name: editor
  namespace: upbound-system
spec:
  forProvider:
    location: us-central1
    members:
    - serviceAccount:official-provider-testing@official-provider-testing.iam.gserviceaccount.com
    nameSelector:
      matchLabels:
        testing.upbound.io/example-name: default
    role: roles/run.invoker

---

apiVersion: cloudrun.gcp.m.upbound.io/v1beta1
kind: V2Job
metadata:
  annotations:
    meta.upbound.io/example-id: cloudrun/v1beta1/v2jobiambinding
  labels:
    testing.upbound.io/example-name: default
  name: default
  namespace: upbound-system
spec:
  forProvider:
    launchStage: BETA
    location: us-central1
    template:
      template:
        containers:
        - image: us-docker.pkg.dev/cloudrun/container/hello
