apiVersion: orgpolicy.gcp.upbound.io/v1beta1
kind: CustomConstraint
metadata:
  annotations:
    meta.upbound.io/example-id: orgpolicy/v1beta1/customconstraint
    upjet.upbound.io/manual-intervention: "Custom constraints are created on an organization, and the CI service account has no organization-level roles."
    crossplane.io/external-name: custom.disableGkeAutoUpgrade
  labels:
    testing.upbound.io/example-name: customconstraint
  name: customconstraint
spec:
  forProvider:
    parent: organizations/123456789
    displayName: Disable GKE auto upgrade
    description: Only allow GKE NodePool resource to be created or updated if AutoUpgrade is not enabled.
    actionType: ALLOW
    condition: resource.management.autoUpgrade == false
    methodTypes:
      - CREATE
      - UPDATE
    resourceTypes:
      - container.googleapis.com/NodePool
