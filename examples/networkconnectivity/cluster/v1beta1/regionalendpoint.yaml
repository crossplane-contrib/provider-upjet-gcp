apiVersion: networkconnectivity.gcp.upbound.io/v1beta1
kind: RegionalEndpoint
metadata:
  annotations:
    meta.upbound.io/example-id: networkconnectivity/v1beta1/regionalendpoint
  labels:
    testing.upbound.io/example-name: regional_endpoint
  name: example-${Rand.RFC1123Subdomain}
spec:
  forProvider:
    accessType: REGIONAL
    address: 192.168.0.5
    description: Regional endpoint targeting storage.us-central1.rep.googleapis.com
    labels:
      env: default
    location: us-central1
    networkSelector:
      matchLabels:
        testing.upbound.io/example-name: regional_endpoint
    subnetworkSelector:
      matchLabels:
        testing.upbound.io/example-name: regional_endpoint
    targetGoogleApi: storage.us-central1.rep.googleapis.com

---

apiVersion: compute.gcp.upbound.io/v1beta1
kind: Network
metadata:
  annotations:
    meta.upbound.io/example-id: networkconnectivity/v1beta1/regionalendpoint
  labels:
    testing.upbound.io/example-name: regional_endpoint
  name: example-${Rand.RFC1123Subdomain}
spec:
  forProvider:
    autoCreateSubnetworks: false

---

apiVersion: compute.gcp.upbound.io/v1beta2
kind: Subnetwork
metadata:
  annotations:
    meta.upbound.io/example-id: networkconnectivity/v1beta1/regionalendpoint
  labels:
    testing.upbound.io/example-name: regional_endpoint
  name: example-${Rand.RFC1123Subdomain}
spec:
  forProvider:
    ipCidrRange: 192.168.0.0/24
    networkSelector:
      matchLabels:
        testing.upbound.io/example-name: regional_endpoint
    region: us-central1
