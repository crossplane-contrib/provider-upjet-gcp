apiVersion: managedkafka.gcp.m.upbound.io/v1beta1
kind: Cluster
metadata:
  annotations:
    meta.upbound.io/example-id: managedkafka/v1beta1/cluster
    uptest.upbound.io/timeout: "3600"
  labels:
    testing.upbound.io/example-name: example
  name: example-mk-cluster
  namespace: upbound-system
spec:
  forProvider:
    capacityConfig:
      memoryBytes: "3221225472"
      vcpuCount: "3"
    gcpConfig:
      accessConfig:
        networkConfigs:
        - subnetSelector:
            matchLabels:
              testing.upbound.io/example-name: cluster-subnet
    labels:
      key: value
    location: us-central1
    rebalanceConfig:
      mode: AUTO_REBALANCE_ON_SCALE_UP

---

apiVersion: compute.gcp.m.upbound.io/v1beta1
kind: Network
metadata:
  annotations:
    meta.upbound.io/example-id: managedkafka/v1beta1/cluster
  labels:
    testing.upbound.io/example-name: cluster-net
  name: mk-cluster-net
  namespace: upbound-system
spec:
  forProvider:
    autoCreateSubnetworks: false

---

apiVersion: compute.gcp.m.upbound.io/v1beta1
kind: Subnetwork
metadata:
  annotations:
    meta.upbound.io/example-id: managedkafka/v1beta1/cluster
  labels:
    testing.upbound.io/example-name: cluster-subnet
  name: mk-cluster-subnet
  namespace: upbound-system
spec:
  forProvider:
    ipCidrRange: 10.10.0.0/24
    networkSelector:
      matchLabels:
        testing.upbound.io/example-name: cluster-net
    region: us-central1
