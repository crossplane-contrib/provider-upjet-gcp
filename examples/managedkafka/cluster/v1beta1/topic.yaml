apiVersion: managedkafka.gcp.upbound.io/v1beta1
kind: Topic
metadata:
  annotations:
    meta.upbound.io/example-id: managedkafka/v1beta1/topic
    uptest.upbound.io/timeout: "3600"
  labels:
    testing.upbound.io/example-name: example
  name: example-mk-topic
spec:
  forProvider:
    clusterSelector:
      matchLabels:
        testing.upbound.io/example-name: topic-cluster
    configs:
      cleanup.policy: compact
    location: us-central1
    partitionCount: 2
    replicationFactor: 3

---

apiVersion: managedkafka.gcp.upbound.io/v1beta1
kind: Cluster
metadata:
  annotations:
    meta.upbound.io/example-id: managedkafka/v1beta1/topic
    uptest.upbound.io/timeout: "3600"
  labels:
    testing.upbound.io/example-name: topic-cluster
  name: example-mk-topic-cluster
spec:
  forProvider:
    capacityConfig:
      memoryBytes: "3221225472"
      vcpuCount: "3"
    gcpConfig:
      accessConfig:
        networkConfigs:
        - subnetSelector:
            matchLabels:
              testing.upbound.io/example-name: topic-subnet
    location: us-central1

---

apiVersion: compute.gcp.upbound.io/v1beta1
kind: Network
metadata:
  annotations:
    meta.upbound.io/example-id: managedkafka/v1beta1/topic
  labels:
    testing.upbound.io/example-name: topic-net
  name: mk-topic-net
spec:
  forProvider:
    autoCreateSubnetworks: false

---

apiVersion: compute.gcp.upbound.io/v1beta2
kind: Subnetwork
metadata:
  annotations:
    meta.upbound.io/example-id: managedkafka/v1beta1/topic
  labels:
    testing.upbound.io/example-name: topic-subnet
  name: mk-topic-subnet
spec:
  forProvider:
    ipCidrRange: 10.11.0.0/24
    networkSelector:
      matchLabels:
        testing.upbound.io/example-name: topic-net
    region: us-central1
