apiVersion: apigee.gcp.upbound.io/v1beta2
kind: Organization
metadata:
  annotations:
    meta.upbound.io/example-id: apigee/v1beta2/organization
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    analyticsRegion: us-central1
    authorizedNetworkSelector:
      matchLabels:
        testing.upbound.io/example-name: apigee_network
    projectId: ${project.project_id}
---
apiVersion: apigee.gcp.upbound.io/v1beta1
kind: API
metadata:
  annotations:
    meta.upbound.io/example-id: apigee/v1beta1/api
  labels:
    testing.upbound.io/example-name: api_proxy
  name: api-proxy
spec:
  forProvider:
    configBundle: ${proxy.base64_content}
    orgIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
