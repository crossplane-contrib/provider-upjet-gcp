apiVersion: alloydb.gcp.upbound.io/v1beta1
kind: User
metadata:
  annotations:
    meta.upbound.io/example-id: alloydb/v1beta1/user
  labels:
    testing.upbound.io/example-name: user1
  name: user1
spec:
  forProvider:
    clusterSelector:
      matchLabels:
        testing.upbound.io/example-name: default
    databaseRoles:
    - alloydbsuperuser
    passwordSecretRef:
      key: example-key
      name: example-secret
      namespace: upbound-system
    userType: ALLOYDB_BUILT_IN

---

apiVersion: alloydb.gcp.upbound.io/v1beta2
kind: Cluster
metadata:
  annotations:
    meta.upbound.io/example-id: alloydb/v1beta1/user
  labels:
    testing.upbound.io/example-name: default
  name: default
spec:
  forProvider:
    deletionProtection: false
    initialUser:
      passwordSecretRef:
        key: example-key
        name: example-secret
        namespace: upbound-system
    location: us-central1
    networkConfig:
      networkSelector:
        matchLabels:
          testing.upbound.io/example-name: google_compute_network

---

apiVersion: alloydb.gcp.upbound.io/v1beta2
kind: Instance
metadata:
  annotations:
    meta.upbound.io/example-id: alloydb/v1beta1/user
  labels:
    testing.upbound.io/example-name: default
  name: default
spec:
  forProvider:
    clusterSelector:
      matchLabels:
        testing.upbound.io/example-name: default
    instanceTypeSelector:
      matchLabels:
        testing.upbound.io/example-name: example

---

apiVersion: compute.gcp.upbound.io/v1beta1
kind: GlobalAddress
metadata:
  annotations:
    meta.upbound.io/example-id: alloydb/v1beta1/user
  labels:
    testing.upbound.io/example-name: private_ip_alloc
  name: private-ip-alloc
spec:
  forProvider:
    addressType: INTERNAL
    networkSelector:
      matchLabels:
        testing.upbound.io/example-name: default
    prefixLength: 16
    purpose: VPC_PEERING

---

apiVersion: compute.gcp.upbound.io/v1beta1
kind: Network
metadata:
  annotations:
    meta.upbound.io/example-id: alloydb/v1beta1/user
  labels:
    testing.upbound.io/example-name: default
  name: default
spec:
  forProvider: {}

---

apiVersion: servicenetworking.gcp.upbound.io/v1beta1
kind: Connection
metadata:
  annotations:
    meta.upbound.io/example-id: alloydb/v1beta1/user
  labels:
    testing.upbound.io/example-name: vpc_connection
  name: vpc-connection
spec:
  forProvider:
    networkSelector:
      matchLabels:
        testing.upbound.io/example-name: default
    reservedPeeringRangesRefs:
    - name: private_ip_alloc
    service: servicenetworking.googleapis.com
