apiVersion: vectorsearch.gcp.upbound.io/v1beta1
kind: Index
metadata:
  annotations:
    meta.upbound.io/example-id: vectorsearch/v1beta1/index
  labels:
    testing.upbound.io/example-name: example-index
  name: example-index
spec:
  forProvider:
    collectionIdSelector:
      matchLabels:
        testing.upbound.io/example-name: parent
    denseScann:
      featureNormType: UNIT_L2_NORM
    description: ScaNN index over text_embedding.
    displayName: My Awesome Index
    distanceMetric: DOT_PRODUCT
    indexField: text_embedding
    location: us-central1

---

apiVersion: vectorsearch.gcp.upbound.io/v1beta1
kind: Collection
metadata:
  annotations:
    meta.upbound.io/example-id: vectorsearch/v1beta1/index
  labels:
    testing.upbound.io/example-name: parent
  name: parent
spec:
  forProvider:
    dataSchema: |
      {
        "type": "object",
        "properties": {
          "title": {
            "type": "string"
          },
          "plot": {
            "type": "string"
          }
        }
      }
    description: This collection stores important data.
    displayName: My Awesome Collection
    location: us-central1
    vectorSchema:
    - denseVector:
        dimensions: 768
        vertexEmbeddingConfig:
          modelId: textembedding-gecko@003
          taskType: RETRIEVAL_DOCUMENT
          textTemplate: 'Title: {title} ---- Plot: {plot}'
      fieldName: text_embedding
