apiVersion: backupdr.gcp.upbound.io/v1beta1
kind: BackupPlan
metadata:
  annotations:
    meta.upbound.io/example-id: backupdr/v1beta1/backupplan
  labels:
    testing.upbound.io/example-name: my-backup-plan-1
  name: my-backup-plan-1
spec:
  forProvider:
    backupRules:
    - backupRetentionDays: 5
      ruleId: rule-1
      standardSchedule:
        backupWindow:
          endHourOfDay: 24
          startHourOfDay: 0
        hourlyFrequency: 6
        recurrenceType: HOURLY
        timeZone: UTC
    backupVaultSelector:
      matchLabels:
        testing.upbound.io/example-name: my_backup_vault
    location: us-central1
    maxCustomOnDemandRetentionDays: 30
    resourceType: compute.googleapis.com/Instance

---

apiVersion: backupdr.gcp.upbound.io/v1beta1
kind: BackupVault
metadata:
  annotations:
    meta.upbound.io/example-id: backupdr/v1beta1/backupplan
  labels:
    testing.upbound.io/example-name: my_backup_vault
  name: my-backup-vault
spec:
  forProvider:
    backupMinimumEnforcedRetentionDuration: 100000s
    location: us-central1
