apiVersion: compute.gcp.m.upbound.io/v1beta1
kind: RegionTargetTCPProxy
metadata:
  annotations:
    meta.upbound.io/example-id: compute/v1beta1/regiontargettcpproxy
  labels:
    testing.upbound.io/example-name: default
  name: default
  namespace: upbound-system
spec:
  forProvider:
    backendServiceSelector:
      matchLabels:
        testing.upbound.io/example-name: default
    region: us-central1

---

apiVersion: compute.gcp.m.upbound.io/v1beta1
kind: RegionBackendService
metadata:
  annotations:
    meta.upbound.io/example-id: compute/v1beta1/regiontargettcpproxy
  labels:
    testing.upbound.io/example-name: default
  name: default
  namespace: upbound-system
spec:
  forProvider:
    healthChecksRefs:
    - name: default
    loadBalancingScheme: INTERNAL_MANAGED
    protocol: TCP
    region: us-central1
    timeoutSec: 10

---

apiVersion: compute.gcp.m.upbound.io/v1beta1
kind: RegionHealthCheck
metadata:
  annotations:
    meta.upbound.io/example-id: compute/v1beta1/regiontargettcpproxy
  labels:
    testing.upbound.io/example-name: default
  name: default
  namespace: upbound-system
spec:
  forProvider:
    checkIntervalSec: 1
    region: us-central1
    tcpHealthCheck:
      port: "80"
    timeoutSec: 1
