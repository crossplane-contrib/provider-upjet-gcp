apiVersion: networkservices.gcp.m.upbound.io/v1beta1
kind: LBTrafficExtension
metadata:
  annotations:
    meta.upbound.io/example-id: networkservices/v1beta1/lbtrafficextension
  labels:
    testing.upbound.io/example-name: default
  name: default
  namespace: upbound-system
spec:
  forProvider:
    description: my traffic extension
    extensionChains:
    - extensions:
      - authority: ext11.com
        failOpen: false
        forwardAttributes:
        - request.host
        - request.path
        forwardHeaders:
        - custom-header
        metadata:
          key1: value1
          key2: value2
        name: ext11
        serviceSelector:
          matchLabels:
            testing.upbound.io/example-name: callouts_backend
        supportedEvents:
        - REQUEST_HEADERS
        timeout: 0.1s
      matchCondition:
        celExpression: request.host == 'example.com'
      name: chain1
    forwardingRulesRefs:
    - name: default
    labels:
      foo: bar
    loadBalancingScheme: INTERNAL_MANAGED
    location: us-west1

---

apiVersion: compute.gcp.m.upbound.io/v1beta1
kind: Firewall
metadata:
  annotations:
    meta.upbound.io/example-id: networkservices/v1beta1/lbtrafficextension
  labels:
    testing.upbound.io/example-name: fw_iap
  name: fw-iap
  namespace: upbound-system
spec:
  forProvider:
    allow:
    - protocol: tcp
    direction: INGRESS
    networkSelector:
      matchLabels:
        testing.upbound.io/example-name: ilb_network
    sourceRanges:
    - 130.211.0.0/22
    - 35.191.0.0/16
    - 35.235.240.0/20

---

apiVersion: compute.gcp.m.upbound.io/v1beta1
kind: Firewall
metadata:
  annotations:
    meta.upbound.io/example-id: networkservices/v1beta1/lbtrafficextension
  labels:
    testing.upbound.io/example-name: fw_ilb_to_backends
  name: fw-ilb-to-backends
  namespace: upbound-system
spec:
  forProvider:
    allow:
    - ports:
      - "80"
      - "443"
      - "8080"
      protocol: tcp
    direction: INGRESS
    networkSelector:
      matchLabels:
        testing.upbound.io/example-name: ilb_network
    sourceRanges:
    - 10.0.0.0/24
    targetTags:
    - http-server

---

apiVersion: compute.gcp.m.upbound.io/v1beta1
kind: ForwardingRule
metadata:
  annotations:
    meta.upbound.io/example-id: networkservices/v1beta1/lbtrafficextension
  labels:
    testing.upbound.io/example-name: default
  name: default
  namespace: upbound-system
spec:
  forProvider:
    ipProtocol: TCP
    loadBalancingScheme: INTERNAL_MANAGED
    networkSelector:
      matchLabels:
        testing.upbound.io/example-name: ilb_network
    networkTier: PREMIUM
    portRange: "80"
    region: us-west1
    subnetworkSelector:
      matchLabels:
        testing.upbound.io/example-name: ilb_subnet
    targetSelector:
      matchLabels:
        testing.upbound.io/example-name: default

---

apiVersion: compute.gcp.m.upbound.io/v1beta1
kind: Instance
metadata:
  annotations:
    meta.upbound.io/example-id: networkservices/v1beta1/lbtrafficextension
  labels:
    testing.upbound.io/example-name: callouts_instance
  name: callouts-instance
  namespace: upbound-system
spec:
  forProvider:
    bootDisk:
      autoDelete: true
      initializeParams:
        imageSelector:
          matchLabels:
            testing.upbound.io/example-name: example
        size: 10
        type: pd-standard
    deletionProtection: false
    labels:
      container-vm: cos-stable-109-17800-147-54
    machineType: e2-small
    metadata:
      gce-container-declaration: |
        # DISCLAIMER:
        # This container declaration format is not a public API and may change without
        # notice. Please use gcloud command-line tool or Google Cloud Console to run
        # Containers on Google Compute Engine.

        spec:
          containers:
          - image: us-docker.pkg.dev/service-extensions-samples/callouts/python-example-basic:main
            name: callouts-vm
            securityContext:
              privileged: false
            stdin: false
            tty: false
            volumeMounts: []
          restartPolicy: Always
          volumes: []
      google-logging-enabled: "true"
    networkInterface:
    - accessConfig:
      - {}
      networkSelector:
        matchLabels:
          testing.upbound.io/example-name: ilb_network
      subnetworkSelector:
        matchLabels:
          testing.upbound.io/example-name: ilb_subnet
    tags:
    - allow-ssh
    - load-balanced-backend
    zone: us-west1-a

---

