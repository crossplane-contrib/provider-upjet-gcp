apiVersion: vertexai.gcp.m.upbound.io/v1beta1
kind: ReasoningEngineIAMPolicy
metadata:
  annotations:
    meta.upbound.io/example-id: vertexai/v1beta1/reasoningengineiampolicy
  labels:
    testing.upbound.io/example-name: policy
  name: policy
  namespace: upbound-system
spec:
  forProvider:
    policyData: ${data.google_iam_policy.admin.policy_data}
    projectSelector:
      matchLabels:
        testing.upbound.io/example-name: reasoning_engine
    reasoningEngineSelector:
      matchLabels:
        testing.upbound.io/example-name: reasoning_engine
    regionSelector:
      matchLabels:
        testing.upbound.io/example-name: reasoning_engine
