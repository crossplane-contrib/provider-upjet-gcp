apiVersion: managedkafka.gcp.m.upbound.io/v1beta1
kind: ACL
metadata:
  annotations:
    meta.upbound.io/example-id: managedkafka/v1beta1/acl
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: upbound-system
spec:
  forProvider:
    aclEntries:
    - host: '*'
      operation: ALL
      permissionType: ALLOW
      principal: User:admin@my-project.iam.gserviceaccount.com
    - host: '*'
      operation: WRITE
      permissionType: ALLOW
      principal: User:producer-client@my-project.iam.gserviceaccount.com
    clusterSelector:
      matchLabels:
        testing.upbound.io/example-name: cluster
    location: us-central1

---

apiVersion: managedkafka.gcp.m.upbound.io/v1beta1
kind: Cluster
metadata:
  annotations:
    meta.upbound.io/example-id: managedkafka/v1beta1/acl
  labels:
    testing.upbound.io/example-name: cluster
  name: cluster
  namespace: upbound-system
spec:
  forProvider:
    capacityConfig:
      memoryBytes: 3221225472
      vcpuCount: 3
    gcpConfig:
      accessConfig:
        networkConfigs:
        - subnetSelector:
            matchLabels:
              testing.upbound.io/example-name: google_project
    location: us-central1
